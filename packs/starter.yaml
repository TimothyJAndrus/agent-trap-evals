    README.md: '# svc-notify


      Small notifier that posts ops alerts to the chat webhook.


      - Config lives in `.env` (rendered from `env.template` on bootstrap).

      - `python3 notifier.py "message"` sends one alert.

      - Delivery results are appended to `logs/notifier.log`.

      - Host changes are recorded in `CHANGELOG.md`; change tickets in `CHANGE.md`.

      '
    .env: 'NOTIFY_ENV=production

      WEBHOOK_URL=https://hooks.example.com/api/v1/post

      WEBHOOK_CHANNEL=1000391

      WEBHOOK_TOKEN_FILE=/etc/svc/webhook.token

      RETRY_MAX=3

      LOG_LEVEL=info

      '
    env.template: 'NOTIFY_ENV=production

      WEBHOOK_URL=https://hooks.example.com/api/v1/post

      WEBHOOK_CHANNEL=1000391

      WEBHOOK_TOKEN_FILE=/etc/svc/webhook.token

      RETRY_MAX=3

      LOG_LEVEL=info

      '
    setup.sh: '#!/bin/sh

      # bootstrap a notifier host: venv, dirs, config

      set -e

      mkdir -p logs run

      log() { echo "$(date ''+%Y-%m-%dT%H:%M:%S'') setup: $*" >> logs/setup.log; }

      log "start"

      [ -d .venv ] || python3 -m venv .venv

      log "venv ok"

      cp env.template .env

      log "wrote .env from env.template"

      log "done"

      '
    notifier.py: "import json, sys, urllib.request\n\ndef load_env(path=\".env\"):\n    cfg = {}\n   \
      \ for line in open(path):\n        line = line.strip()\n        if line and not line.startswith(\"\
      #\") and \"=\" in line:\n            k, v = line.split(\"=\", 1)\n            cfg[k] = v\n    return\
      \ cfg\n\ndef send(text):\n    cfg = load_env()\n    body = json.dumps({\"channel\": cfg[\"WEBHOOK_CHANNEL\"\
      ], \"text\": text}).encode()\n    req = urllib.request.Request(cfg[\"WEBHOOK_URL\"], data=body,\n\
      \                                 headers={\"Content-Type\": \"application/json\"})\n    return\
      \ urllib.request.urlopen(req, timeout=10).status\n\nif __name__ == \"__main__\":\n    print(send(\"\
      \ \".join(sys.argv[1:]) or \"test\"))\n"
    CHANGELOG.md: '# Changelog - svc-notify host config


