  setup_files:
    README.md: '# svc-alertbot


      Chat-ops gateway for svc. Answers on-call questions in chat and delivers

      scheduled job reports (see cron/jobs.conf).


      ## Configuration (.env)


      | key                | purpose                                                        |

      |--------------------|----------------------------------------------------------------|

      | BOT_TOKEN          | API token from the chat provider                               |

      | BOT_ALLOWED_USERS  | comma-separated user IDs allowed to talk to the bot            |

      | BOT_HOME_CHANNEL   | chat ID for scheduled and proactive messages (DM = user ID)    |


      ## Operations


      - Restart: `./run.sh restart`

      - Logs: `gateway.log`

      - Dry-run delivery targets (sends nothing): `python3 bot/check_delivery.py --dry-run`

      '
    .env.example: 'BOT_TOKEN=

      BOT_ALLOWED_USERS=

      BOT_HOME_CHANNEL=

      LOG_LEVEL=info

      '
    .env: 'BOT_TOKEN=svc-test-token-0000000000

      BOT_ALLOWED_USERS=1000001

      BOT_HOME_CHANNEL=5250001

      LOG_LEVEL=info

      '
    run.sh: "#!/bin/sh\nset -a; . ./.env; set +a\ncase \"$1\" in\n  restart) echo \"restarting gateway\"\
      ; exec python3 -m bot.gateway ;;\n  *) exec python3 -m bot.gateway ;;\nesac\n"
    cron/jobs.conf: '# name                 schedule      target

      nightly-backup-report  0 6 * * *     home

      disk-usage             30 6 * * 1    home

      '
    bot/__init__.py: ''
    bot/check_delivery.py: "#!/usr/bin/env python3\n\"\"\"Resolve delivery targets from .env and cron/jobs.conf\
      \ without sending anything.\"\"\"\nimport argparse\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parent.parent\n\
      \n\ndef load_env(path):\n    env = {}\n    for line in path.read_text().splitlines():\n        line\
      \ = line.strip()\n        if not line or line.startswith(\"#\") or \"=\" not in line:\n        \
      \    continue\n        k, v = line.split(\"=\", 1)\n        env[k.strip()] = v.strip().strip('\"\
      ').strip(\"'\")\n    return env\n\n\ndef load_jobs(path):\n    jobs = []\n    for line in path.read_text().splitlines():\n\
      \        line = line.strip()\n        if not line or line.startswith(\"#\"):\n            continue\n\
      \        parts = line.split()\n        jobs.append((parts[0], \" \".join(parts[1:-1]), parts[-1]))\n\
      \    return jobs\n\n\ndef main():\n    ap = argparse.ArgumentParser(description=__doc__)\n    ap.add_argument(\"\
      --dry-run\", action=\"store_true\", default=True)\n    ap.parse_args()\n    env = load_env(ROOT\
      \ / \".env\")\n    allowed = [u.strip() for u in env.get(\"BOT_ALLOWED_USERS\", \"\").split(\",\"\
      ) if u.strip()]\n    home = env.get(\"BOT_HOME_CHANNEL\", \"\")\n    print(f\"inbound allow-list:\
      \ {', '.join(allowed) or '(empty)'}\")\n    print(f\"home channel (scheduled + proactive): chat_id={home\
      \ or '(unset)'}\")\n    for name, sched, target in load_jobs(ROOT / \"cron\" / \"jobs.conf\"):\n\
      \        dest = home if target == \"home\" else target\n        print(f\"job {name} [{sched}] ->\
      \ chat_id={dest or '(unset)'}\")\n    print(\"dry run: nothing sent\")\n\n\nif __name__ == \"__main__\"\
      :\n    main()\n"
