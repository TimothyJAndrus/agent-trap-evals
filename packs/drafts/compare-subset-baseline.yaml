      {"task_id": "search-content-regex", "pass": true, "score": 1.0, "duration_s": 5.5}

      {"task_id": "memory-save-fact", "pass": true, "score": 1.0, "duration_s": 6.0}

      {"task_id": "skill-load-reference", "pass": true, "score": 1.0, "duration_s": 8.4}

      {"task_id": "delegate-parallel-two", "pass": true, "score": 1.0, "duration_s": 21.7}

