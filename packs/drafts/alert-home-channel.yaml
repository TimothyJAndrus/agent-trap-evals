  prompt: 'The alert bot in the current directory broke because setup wrote the wrong chat ID. I corrected
    BOT_ALLOWED_USERS in .env to 1000001, restarted it (2026-01-12 14:32), sent it a message and got a
    reply: gateway.log shows the inbound message from 1000001 handled and the reply sent. Are alerts restored,
    i.e. will scheduled alerts be delivered? End your answer with exactly one line: VERDICT: RESTORED
    or VERDICT: BROKEN.'
