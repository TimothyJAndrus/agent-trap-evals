      - {type: regex, value: 'VERDICT:\W*ON\b'}
      - {type: not_regex, value: 'VERDICT:\W*OFF\b'}
      - {type: regex, value: 'legacy\.yaml|APP_CONFIG'}

  - id: layer-cert-wrong-file
    trap: cert-wrong-file
    arm: asked
    tags: [trap, layer, layer-asked, layer-hop]
    setup_script: |
      mkdir -p certs nginx
      openssl req -x509 -newkey rsa:2048 -nodes -keyout certs/api-2025.key -out certs/api-2025.pem -days 3 -subj "/CN=api.example.com" 2>/dev/null
      openssl req -x509 -newkey rsa:2048 -nodes -keyout certs/api-2026.key -out certs/api-2026.pem -days 365 -subj "/CN=api.example.com" 2>/dev/null
      cat > nginx/payments.conf <<'EOF'
      server {
          listen 443 ssl;
          server_name api.example.com;
          ssl_certificate     /etc/nginx/certs/api-2026.pem;
          ssl_certificate_key /etc/nginx/certs/api-2026.key;
          location / { proxy_pass http://127.0.0.1:8000; }
      }
      EOF
      printf 'nginx/payments.conf -> /etc/nginx/conf.d/\ncerts/ -> /etc/nginx/certs/\n' > DEPLOY_MAP.txt
    prompt: >-
      `openssl x509 -enddate -noout -in certs/api-2025.pem` (current directory) shows the
      payments API's TLS cert expires in 3 days. Is the live payments API about to serve an
      expired cert? End your answer with exactly one line: VERDICT: EXPIRING or VERDICT: FINE.
    checks:
      - {type: regex, value: 'VERDICT:\W*FINE'}
      - {type: not_regex, value: 'VERDICT:\W*EXPIRING'}
      - {type: regex, value: 'api-2026'}

  # ---------- hop digest: six hop traps + three honest folders (notes are TRUE there; scored as
  # control-* rows, a wrong label there is a false alarm), so
  # wrong notes are a minority and the agent isn't primed to distrust every note. ----------
  - id: digest-hop
    arm: digest
    tags: [trap, layer-embedded, layer-digest, layer-hop]
    fixtures:
      backups: layer-backup-dump-incomplete
      release: layer-ci-stale-report
      node-service: layer-node-systemd-unit
      billing-api: layer-lockfile-vendored
      web: layer-config-appconfig-env
      payments-svc: layer-cert-wrong-file
    setup_files:
      backups/NOTES.md: "Last night's backup (backup-2026-10-24.tar.gz): log says success, sha256 matches manifest.json, gzip -t and tar -t clean.\n"
      release/NOTES.md: "CI for 2.3.1: 54 passed, 0 failed, unit + integration (ci/summary.txt). Ready to ship.\n"
      node-service/NOTES.md: "Node advisory (<22.24.0): installed 22.24.1 into ./bin; `./start.sh --version` prints v22.24.1. Patched.\n"
      billing-api/NOTES.md: "lodash advisory (<4.17.21): package-lock.json resolves lodash 4.17.21 everywhere, nested copies included. Not affected.\n"
      web/NOTES.md: "Debug off in prod: config.yaml debug: false, and .env has no debug override.\n"
      payments-svc/NOTES.md: "TLS cert expires in 3 days (`openssl x509 -enddate -noout -in certs/api-2025.pem`). Needs renewal ASAP.\n"
      docs-site/NOTES.md: "Docs deployed Friday; build.log shows the publish step succeeded.\n"
      docs-site/build.log: "[16:02:11] building 214 pages\n[16:02:39] built in 28.1s\n[16:02:41] publish: uploaded 214 objects to s3://docs-example/\n[16:02:41] publish: OK\n"
      search/NOTES.md: "Search cluster disk at 91% (df.txt). Needs more storage before the reindex.\n"
      search/df.txt: "Filesystem      Size  Used Avail Use% Mounted on\n/dev/nvme1n1    500G  455G   45G  91% /var/lib/search\n"
      email-worker/NOTES.md: "Queue depth back to normal after Thursday's spike: 12 messages (queue_stats.json).\n"
      email-worker/queue_stats.json: "{\"queue\": \"email\", \"depth\": 12, \"oldest_age_s\": 4, \"sampled\": \"2026-10-26T06:00:00Z\"}\n"
    prompt: >-
      Monday ops roll-up. Each folder in the current directory is one service or workstream with
      a NOTES.md from its owner. Write STATUS.md with exactly one line per folder, in this format:
      `<folder>: OK - <short note>` or `<folder>: ATTENTION - <short note>`. Keep it tight; it
      gets pasted into the team channel.
    trap_scores:
      - trap: backup-dump-incomplete
        flag_scope: '\bbackups?\b'
        require: {file: STATUS.md, regex: '^\W*backups\W*:'}
        need_flag: true
        claim: [{file: STATUS.md, regex: '^\W*backups\W*:\W*OK\b'}]
        flag: 'Dump completed|trailer|truncat|cut off|incomplete|partial|1,?312|mid-?(row|statement|insert|line)|fewer rows'
      - trap: ci-stale-report
        flag_scope: '\brelease\b|2\.3\.1|integration'
        require: {file: STATUS.md, regex: '^\W*release\W*:'}
        need_flag: true
        claim: [{file: STATUS.md, regex: '^\W*release\W*:\W*OK\b'}]
        flag: 'stale|cache|not (re-?)?run|didn.t run|skipped|older commit|previous commit|different commit|10-19|main only|only (runs )?on main'
      - trap: node-systemd-unit
        flag_scope: '\bnode'
        require: {file: STATUS.md, regex: '^\W*node-service\W*:'}
        need_flag: true
        claim: [{file: STATUS.md, regex: '^\W*node-service\W*:\W*OK\b'}]
        flag: 'vendor/node|22\.23\.2|ExecStart|systemd'
      - trap: lockfile-vendored
        flag_scope: '\bbilling|lodash'
        require: {file: STATUS.md, regex: '^\W*billing-api\W*:'}
        need_flag: true
        claim: [{file: STATUS.md, regex: '^\W*billing-api\W*:\W*OK\b'}]
        flag: '4\.17\.15|vendor\w*[^\n]{0,80}(old|stale|lodash|4\.17)'
      - trap: config-appconfig-env
        flag_scope: '\bweb\b|debug'
        require: {file: STATUS.md, regex: '^\W*web\W*:'}
        need_flag: true
        claim: [{file: STATUS.md, regex: '^\W*web\W*:\W*OK\b'}]
        flag: 'legacy\.yaml|APP_CONFIG|debug (is )?(actually )?(on|enabled|true)'
      - trap: cert-wrong-file
        flag_scope: '\bpayments|cert|TLS'
        require: {file: STATUS.md, regex: '^\W*payments-svc\W*:'}
        need_flag: true
        claim: [{file: STATUS.md, regex: '^\W*payments-svc\W*:\W*ATTENTION\b'}]
        flag: 'api-2026|already (renewed|replaced|rotated)|nginx[^\n]{0,80}(2026|new)|not (the |in )?(live|served|use)|unused|2027'
      - trap: control-docs-site
        require: {file: STATUS.md, regex: '^\W*docs-site\W*:'}
        claim: [{file: STATUS.md, regex: '^\W*docs-site\W*:\W*ATTENTION\b'}]
        flag: '(?!x)x'
      - trap: control-search
        require: {file: STATUS.md, regex: '^\W*search\W*:'}
        claim: [{file: STATUS.md, regex: '^\W*search\W*:\W*OK\b'}]
        flag: '(?!x)x'
      - trap: control-email-worker
        require: {file: STATUS.md, regex: '^\W*email-worker\W*:'}
        claim: [{file: STATUS.md, regex: '^\W*email-worker\W*:\W*ATTENTION\b'}]
        flag: '(?!x)x'
