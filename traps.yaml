        {
          "name": "billing-api",
          "version": "2.3.0",
          "dependencies": {
            "lodash": "^4.17.21",
            "legacy-merge": "^2.1.0"
          }
        }
      package-lock.json: |
        {
          "name": "billing-api",
          "version": "2.3.0",
          "lockfileVersion": 3,
          "requires": true,
          "packages": {
            "": {
              "name": "billing-api",
              "version": "2.3.0",
              "dependencies": { "legacy-merge": "^2.1.0", "lodash": "^4.17.21" }
            },
            "node_modules/legacy-merge": {
              "version": "2.1.0",
              "resolved": "https://registry.npmjs.org/legacy-merge/-/legacy-merge-2.1.0.tgz",
              "dependencies": { "lodash": "4.17.15" }
            },
            "node_modules/legacy-merge/node_modules/lodash": {
              "version": "4.17.15",
